name: Deploy SOME Distribution Site

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Validate signing secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          missing=0
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD OPENROUTER_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing $name GitHub secret." >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode signing keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > keystore/some-release.jks

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore/some-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/auto
          OPENROUTER_REFERER: https://replybubble.local
          OPENROUTER_TITLE: SOME
          UPDATE_FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/latest.json
          UPDATE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: ./gradlew clean assembleRelease --no-build-cache --console=plain

      - name: Verify OpenRouter key is embedded in APK
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import zipfile

          apk_path = "app/build/outputs/apk/release/app-release.apk"
          key = os.environ["OPENROUTER_API_KEY"].encode("utf-8")

          with zipfile.ZipFile(apk_path) as apk_file:
              classes_dex = apk_file.read("classes.dex")

          if key not in classes_dex:
              print("The release APK was built without the OpenRouter API key.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Read version
        id: version
        shell: bash
        run: |
          echo "version_code=$(grep VERSION_CODE version.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
          echo "version_name=$(grep VERSION_NAME version.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"
          TITLE="SOME ${{ steps.version.outputs.version_name }}"
          mkdir -p release-artifacts
          ASSET_NAME="some-${{ steps.version.outputs.version_name }}.apk"
          ASSET_PATH="release-artifacts/$ASSET_NAME"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET_PATH"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading fresh APK asset."
          else
            gh release create "$TAG" --title "$TITLE" --notes "Automated SOME release for version ${{ steps.version.outputs.version_name }}."
          fi

          gh release upload "$TAG" "$ASSET_PATH" --clobber

      - name: Prepare site
        shell: pwsh
        run: |
          ./scripts/prepare-distribution-site.ps1 `
            -BaseUrl "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" `
            -DownloadUrl "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version_name }}/some-${{ steps.version.outputs.version_name }}.apk" `
            -SkipApkCopy

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: distribution-site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
