<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOME Download</title>
  <style>
    :root {
      --pink: #f05d9b;
      --pink-soft: #f8d6ea;
      --bg: #fff7fc;
      --text: #35253a;
      --muted: #6f6172;
      --card: rgba(255,255,255,.96);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Apple SD Gothic Neo", sans-serif;
      background:
        radial-gradient(circle at top right, #ffe7f4 0%, transparent 35%),
        radial-gradient(circle at bottom left, #f2e8ff 0%, transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid rgba(240,93,155,.18);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(99, 54, 95, .14);
      padding: 28px;
      backdrop-filter: blur(12px);
    }
    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 40px;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      line-height: 1.6;
      color: var(--muted);
    }
    .row {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(112, 91, 114, .12);
    }
    .meta {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--pink-soft), #fff);
      color: var(--text);
      font-weight: 600;
    }
    .button {
      display: block;
      width: 100%;
      text-decoration: none;
      text-align: center;
      margin-top: 14px;
      padding: 15px 18px;
      border-radius: 18px;
      color: #1f1522;
      font-weight: 700;
      background: linear-gradient(135deg, var(--pink-soft), #fff);
      border: 1px solid rgba(240,93,155,.22);
    }
    .hint {
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>SOME</h1>
    <p>This page hosts the latest SOME APK. On Android, you may need to allow installs from unknown apps before opening the file.</p>

    <section class="row">
      <div class="meta">Latest version: 1.0.7</div>
      <a class="button" href="https://github.com/coderoy105/SOME/releases/download/v1.0.7/some-1.0.7.apk">Download latest APK</a>
      <p class="hint">This page and its version metadata are refreshed automatically by the deployment workflow.</p>
    </section>
  </main>
</body>
</html>
