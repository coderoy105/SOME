<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOME</title>
  <style>
    :root {
      --pink: #f05d9b;
      --pink-soft: #f8d6ea;
      --bg: #fff7fc;
      --text: #35253a;
      --muted: #6f6172;
      --card: rgba(255,255,255,.96);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Apple SD Gothic Neo", sans-serif;
      background:
        radial-gradient(circle at top right, #ffe7f4 0%, transparent 35%),
        radial-gradient(circle at bottom left, #f2e8ff 0%, transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid rgba(240,93,155,.18);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(99, 54, 95, .14);
      padding: 28px;
      backdrop-filter: blur(12px);
    }
    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 40px;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      line-height: 1.6;
      color: var(--muted);
    }
    .row {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(112, 91, 114, .12);
    }
    .meta {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--pink-soft), #fff);
      color: var(--text);
      font-weight: 600;
    }
    .button {
      display: block;
      width: 100%;
      text-decoration: none;
      text-align: center;
      margin-top: 14px;
      padding: 15px 18px;
      border-radius: 18px;
      color: #1f1522;
      font-weight: 700;
      background: linear-gradient(135deg, var(--pink-soft), #fff);
      border: 1px solid rgba(240,93,155,.22);
    }
    .hint {
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>SOME</h1>
    <p id="description"></p>

    <section class="row">
      <div class="meta" id="versionLabel"></div>
      <a class="button" href="https://github.com/coderoy105/SOME/releases/download/v1.0.15/some-1.0.15.apk" id="downloadButton"></a>
      <p class="hint" id="hint"></p>
    </section>
  </main>
  <script>
    document.title = 'SOME \uB2E4\uC6B4\uB85C\uB4DC';
    document.getElementById('description').textContent = '\uCD5C\uC2E0 SOME APK \uB2E4\uC6B4\uB85C\uB4DC \uD398\uC774\uC9C0\uC785\uB2C8\uB2E4. \uC124\uCE58 \uC804 "\uC54C \uC218 \uC5C6\uB294 \uC571 \uC124\uCE58" \uD5C8\uC6A9\uC774 \uD544\uC694\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.';
    document.getElementById('versionLabel').textContent = '\uCD5C\uC2E0 \uBC84\uC804: 1.0.15';
    document.getElementById('downloadButton').textContent = '\uCD5C\uC2E0 APK \uB2E4\uC6B4\uB85C\uB4DC';
    document.getElementById('hint').textContent = '\uC774 \uD398\uC774\uC9C0\uC640 \uBC84\uC804 \uC815\uBCF4\uB294 \uCF54\uB4DC\uAC00 \uBC30\uD3EC\uB420 \uB54C \uC790\uB3D9\uC73C\uB85C \uAC31\uC2E0\uB3FC\uC694.';
  </script>
</body>
</html>
